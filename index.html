<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books I've Read</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 28px;
            color: #222;
        }

        .auth-btn {
            background: #0066cc;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .auth-btn:hover {
            background: #0052a3;
        }

        .logout-btn {
            background: #dc3545;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .logout-btn:hover {
            background: #c82333;
        }

        .section {
            margin-bottom: 40px;
        }

        .section h2 {
            font-size: 18px;
            color: #222;
            margin-bottom: 15px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
        }

        .book-list {
            list-style: none;
            margin-left: 20px;
        }

        .book-item {
            padding: 8px 0;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .modal-content h2 {
            margin-bottom: 20px;
        }

        .modal-content input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-btn-login {
            flex: 1;
            padding: 10px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }

        .modal-btn-login:hover {
            background: #0052a3;
        }

        .modal-btn-cancel {
            flex: 1;
            padding: 10px;
            background: #e9ecef;
            color: #333;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }

        .modal-btn-cancel:hover {
            background: #dee2e6;
        }

        .error {
            color: #dc3545;
            font-size: 14px;
            margin-bottom: 15px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .loading {
            color: #999;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Books</h1>
            <div id="authControl">
                <button class="auth-btn" onclick="showLoginModal()">Admin Login</button>
            </div>
        </div>

        <div id="loginModal" class="modal">
            <div class="modal-content">
                <h2>Admin Login</h2>
                <input type="password" id="adminPassword" placeholder="Enter admin password" />
                <div id="loginError" class="error"></div>
                <div class="modal-buttons">
                    <button class="modal-btn-login" onclick="handleLogin()">Login</button>
                    <button class="modal-btn-cancel" onclick="hideLoginModal()">Cancel</button>
                </div>
            </div>
        </div>

        <div id="currentSection" class="section">
            <h2>Current</h2>
            <ul class="book-list" id="currentList">
                <li class="loading">Loading...</li>
            </ul>
        </div>

        <div id="pastSection" class="section">
            <h2>Past</h2>
            <ul class="book-list" id="pastList">
                <li class="loading">Loading...</li>
            </ul>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080';
        let authToken = localStorage.getItem('authToken');

        function showLoginModal() {
            document.getElementById('loginModal').classList.add('show');
            document.getElementById('adminPassword').focus();
        }

        function hideLoginModal() {
            document.getElementById('loginModal').classList.remove('show');
            document.getElementById('adminPassword').value = '';
            document.getElementById('loginError').classList.remove('show');
        }

        async function handleLogin() {
            const password = document.getElementById('adminPassword').value;
            if (!password) return;

            try {
                const response = await fetch(`${API_BASE}/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: password })
                });

                if (response.status === 401) {
                    document.getElementById('loginError').textContent = 'Invalid password';
                    document.getElementById('loginError').classList.add('show');
                    return;
                }

                if (!response.ok) throw new Error('Login failed');

                const data = await response.json();
                authToken = data.token;
                localStorage.setItem('authToken', authToken);
                updateAuthUI();
                hideLoginModal();
            } catch (err) {
                document.getElementById('loginError').textContent = 'Login error';
                document.getElementById('loginError').classList.add('show');
            }
        }

        function logout() {
            fetch(`${API_BASE}/admin/logout`, {
                method: 'POST',
                headers: authToken ? { 'Authorization': `Bearer ${authToken}` } : {}
            }).catch(() => {});

            authToken = null;
            localStorage.removeItem('authToken');
            updateAuthUI();
        }

        function updateAuthUI() {
            const authControl = document.getElementById('authControl');
            if (authToken) {
                authControl.innerHTML = '<button class="logout-btn" onclick="logout()">Logout</button>';
            } else {
                authControl.innerHTML = '<button class="auth-btn" onclick="showLoginModal()">Admin Login</button>';
            }
        }

        async function loadBooks() {
            try {
                const response = await fetch(`${API_BASE}/books`);
                if (!response.ok) throw new Error('Failed to load books');
                const books = await response.json() || [];
                renderBooks(books);
            } catch (err) {
                document.getElementById('currentList').innerHTML = '<li class="loading">Error loading books</li>';
                document.getElementById('pastList').innerHTML = '<li class="loading">Error loading books</li>';
            }
        }

        function renderBooks(books) {
            const current = books.filter(b => b.status === 'currentlyReading');
            const past = books.filter(b => b.status === 'read');

            renderList('currentList', current);
            renderList('pastList', past);
        }

        function renderList(elementId, books) {
            const container = document.getElementById(elementId);
            if (books.length === 0) {
                container.innerHTML = '<li class="loading">None yet</li>';
                return;
            }

            container.innerHTML = books.map(book => `
                <li class="book-item">• ${book.title}</li>
            `).join('');
        }

        updateAuthUI();
        loadBooks();
    </script>
</body>
</html>
