<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <rect width="48" height="48" rx="10" fill="#14211a"/>

  <!-- books standing on the shelf -->
  <rect x="7" y="10" width="6" height="26" rx="1" fill="#c96f4a"/>
  <rect x="8.5" y="13" width="3" height="1.4" fill="#f2e9d8" opacity="0.7"/>

  <rect x="14" y="7" width="5" height="29" rx="1" fill="#e0a940"/>
  <rect x="15.2" y="10" width="2.6" height="1.3" fill="#3a2a12" opacity="0.6"/>

  <rect x="20" y="13" width="6" height="23" rx="1" fill="#7c9473"/>

  <!-- leaning book, tilted for that lived-in shelf look -->
  <g transform="rotate(12 32 24)">
    <rect x="27" y="9" width="6" height="27" rx="1" fill="#a35b6b"/>
  </g>

  <rect x="36" y="15" width="5" height="21" rx="1" fill="#4f7d8c"/>
  <rect x="37.1" y="18" width="2.8" height="1.3" fill="#f2e9d8" opacity="0.7"/>

  <!-- shelf plank -->
  <rect x="5" y="36" width="38" height="3.4" rx="1.2" fill="#8a5a34"/>
  <rect x="5" y="39" width="38" height="1.6" fill="#5f3c22"/>
</svg>
